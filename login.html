<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Travel Explorer</title>
  <link rel="stylesheet" href="./login.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Hidden state controls: these make the tabs & OTP step work with CSS only (no JavaScript) -->
      <input type="radio" name="auth-mode" id="mode-signin" class="auth-state" checked>
      <input type="radio" name="auth-mode" id="mode-signup" class="auth-state">
      <input type="checkbox" id="otp-open" class="auth-state">

      <div class="brand-logo">TRAVEL EXPLORER</div>
      <h2 id="auth-title" data-signin="Welcome Back" data-signup="Create Account"></h2>
      <p id="auth-subtitle" class="subtitle"
         data-signin="Sign in to unlock member fares &amp; instant bookings"
         data-signup="Create an account to start exploring destinations"></p>

      <!-- Sign In / Sign Up Tabs -->
      <div class="auth-tabs">
        <label class="tab-btn" for="mode-signin">Sign In</label>
        <label class="tab-btn" for="mode-signup">Sign Up</label>
      </div>

      <!-- Social Logins: Google & Apple -->
      <div class="social-buttons">
        <a href="./index.html#member" class="social-btn google-btn">
          <span class="icon">G</span> Continue with Google
        </a>
        <a href="./index.html#member" class="social-btn apple-btn">
          <span class="icon">&#63743;</span> Continue with Apple
        </a>
      </div>

      <div class="divider"><span>OR WITH PHONE OTP</span></div>

      <!-- Step 1: Phone / Sign Up Details -->
      <div id="phone-form">
        <div class="input-group" id="name-field">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" placeholder="Enter your full name">
        </div>

        <div class="input-group">
          <label for="phone-number">Mobile Number</label>
          <div class="phone-input-wrap">
            <span class="country-code">+91</span>
            <input type="tel" id="phone-number" maxlength="10" placeholder="Enter 10-digit mobile number">
          </div>
        </div>

        <label for="otp-open" class="primary-btn">Send OTP</label>
      </div>

      <!-- Step 2: 6-Digit OTP Verification -->
      <div id="otp-form">
        <p class="otp-sent-msg">Enter the 6-digit OTP sent to +91 XXXXXXXXXX</p>

        <div class="otp-boxes">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
        </div>

        <a href="./index.html#member" class="primary-btn">Verify &amp; Continue</a>
        <label for="otp-open" class="link-btn">Change Number / Resend OTP</label>
      </div>

      <div class="guest-wrap">
        <a href="./index.html" class="guest-link">Skip for now &rarr; Explore Destinations</a>
      </div>
    </div>
  </div>

</body>
</html>
